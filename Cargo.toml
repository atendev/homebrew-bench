[workspace]
members = ["bench-core", "bench"]
resolver = "2"

[workspace.package]
version = "0.1.18"
edition = "2021"
authors = ["Nathan Beene <beene.nathan@gmail.com>"]
license = "MIT"
repository = "https://github.com/atendev/homebrew-bench"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
directories = "5.0"
toml = "0.8"
sha2 = "0.10"
thiserror = "1.0"
anyhow = "1.0"
hex = "0.4"
serde_path_to_error = "0.1"

# Release archives for `bench`, built by cargo-dist. The hand-written
# install.sh and install.ps1 replace dist's own installers.
[workspace.metadata.dist]
cargo-dist-version = "0.34.0"
ci = "github"
installers = []
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
unix-archive = ".tar.gz"
windows-archive = ".zip"
checksum = "sha256"
auto-includes = false
include = ["NOTICE", "LICENSE", ".agents/skills/homebrew-bench"]
pr-run-mode = "plan"

[profile.dist]
inherits = "release"
lto = "thin"
