[workspace]
members = ["bench-core", "bench"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nathan Beene <beene.nathan@gmail.com>"]
license = "MIT"
repository = "https://github.com/atendev/homebrew-bench"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
directories = "5.0"
toml = "0.8"
sha2 = "0.10"
thiserror = "1.0"
anyhow = "1.0"
hex = "0.4"
serde_path_to_error = "0.1"
